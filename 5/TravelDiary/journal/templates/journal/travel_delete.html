{% extends "journal/base.html" %}
{% block title %}Удаление путешествия{% endblock %}
{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h1 class="h3">Удаление путешествия</h1>
        <p>Удалить запись «{{ travel.title }}»?</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Удалить</button>
            <a class="btn btn-outline-secondary" href="{% url 'travel_detail' travel.pk %}">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
